<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Mã màu RGB</title>
    <link rel="stylesheet" href="Bài5.css" />
  </head>
  <body>
    <table>
      <tr>
        <th>Màu</th>
        <th>Giá trị RGB</th>
      </tr>

      <tr>
        <td class="color-box" style="background-color: rgb(0, 0, 0)"></td>
        <td>rgb(0,0,0)</td>
      </tr>
      <tr>
        <td class="color-box" style="background-color: rgb(255, 0, 0)"></td>
        <td>rgb(255,0,0)</td>
      </tr>
      <tr>
        <td class="color-box" style="background-color: rgb(0, 255, 0)"></td>
        <td>rgb(0,255,0)</td>
      </tr>
      <tr>
        <td class="color-box" style="background-color: rgb(0, 0, 255)"></td>
        <td>rgb(0,0,255)</td>
      </tr>
      <tr>
        <td class="color-box" style="background-color: rgb(255, 255, 0)"></td>
        <td>rgb(255,255,0)</td>
      </tr>
      <tr>
        <td class="color-box" style="background-color: rgb(0, 255, 255)"></td>
        <td>rgb(0,255,255)</td>
      </tr>
      <tr>
        <td class="color-box" style="background-color: rgb(255, 0, 255)"></td>
        <td>rgb(255,0,255)</td>
      </tr>
      <tr>
        <td class="color-box" style="background-color: rgb(192, 192, 192)"></td>
        <td>rgb(192,192,192)</td>
      </tr>
      <tr>
        <td class="color-box" style="background-color: rgb(255, 255, 255)"></td>
        <td>rgb(255,255,255)</td>
      </tr>
    </table>
  </body>
</html>
