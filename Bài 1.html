<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Cô Hái Mơ</title>
  </head>
  <body>
    <div>
      <h2>CÔ HÁI MƠ</h2>
      <pre style="margin: 0">
<i>Thơ thẩn đường chiều một khách thơ,
Say nhìn xa rặng núi xanh lơ,</i>
Khí trời lặng lẽ và trong trẻo,
Thấp thoáng rừng mơ, <b>Cô hái mơ.</b>
</pre>
      <p style="margin-top: 0">
        <u>Tác giả:</u> <i><s>Vô danh</s></i>
      </p>
    </div>
  </body>
</html>
